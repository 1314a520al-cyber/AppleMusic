name: Build AppleMusic IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          VERSION=$(grep -oE 'MARKETING_VERSION: "[^"]+"' project.yml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "MARKETING_VERSION=$VERSION"
          echo "VERSION_LABEL=$VERSION" >> "$GITHUB_ENV"
          xcodebuild \
            -project AppleMusic.xcodeproj \
            -scheme AppleMusic \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/xcodebuild.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/xcodebuild.log
          retention-days: 7

      - name: Package IPA
        if: success()
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AppleMusic.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload AppleMusic-unsigned.ipa
          ls -lh AppleMusic-unsigned.ipa

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AppleMusic-ipa
          path: AppleMusic-unsigned.ipa
          retention-days: 90

      - name: Build release notes from CHANGELOG
        if: success()
        run: |
          VERSION="${{ env.VERSION_LABEL }}"
          python3 - "$VERSION" <<'PYEOF'
          import re, sys
          ver = sys.argv[1]
          try:
              content = open('CHANGELOG.md', encoding='utf-8').read()
              m = re.search(r'^##\s+' + re.escape(ver) + r'\s*$([\s\S]*?)(?=^##\s|\Z)', content, re.M)
              body = m.group(1).strip() if m else ('版本 ' + ver + ' 的更新内容。')
          except Exception:
              body = '版本 ' + ver + ' 的更新内容。'
          body = '# AppleMusic ' + ver + '\n\n' + body + '\n'
          open('release_body.md', 'w', encoding='utf-8').write(body)
          print(body)
          PYEOF

      - name: Publish Release
        if: success()
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.VERSION_LABEL }}
          name: AppleMusic ${{ env.VERSION_LABEL }}
          body_path: release_body.md
          files: AppleMusic-unsigned.ipa
          update_release_body: true
          update_release_name: true
          update_release_assets: true
